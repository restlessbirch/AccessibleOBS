name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    # Проект целиком завязан на Windows: DPAPI, tasklist, ярлык автозагрузки,
    # пути OBS. Сборка на Linux ничего полезного не проверила бы.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan
        run: .\scripts\scan_secrets.ps1
        shell: pwsh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all

      - name: Release build
        run: cargo build --release

      - name: Smoke test
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          Copy-Item target\release\bootstrap.exe bin\ -Force
          Copy-Item target\release\host-agent.exe bin\ -Force
          .\scripts\smoke_test.ps1

      - name: Smoke test (local mode)
        shell: pwsh
        run: |
          # Отдельный прогон: локальный режим написан для v1.1, но в CI не
          # выполнялся вовсе, хотя проверяет и loopback-only, и обход входа.
          .\scripts\smoke_test.ps1 -Local
