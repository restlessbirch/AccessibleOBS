<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Экран актёра — Accessible OBS</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="actor-display">
  <a class="skip" href="#main">Перейти к экрану актёра</a>
  <div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div id="alerts" class="sr-only" aria-live="assertive" aria-atomic="true"></div>

  <header>
    <h1>Экран актёра</h1>
    <p id="displayStatus">Загружаю чат и донаты…</p>
  </header>

  <main id="main" class="display-main">
    <section id="chatPanel" class="display-panel">
      <h2>Чат</h2>
      <div id="chatBox" class="chat-box"></div>
    </section>

    <section id="donationPanel" class="display-panel">
      <h2>Донаты</h2>
      <div id="donationState" class="display-state">Проверяю DonationAlerts…</div>
      <ul id="displayDonations" class="display-donations"></ul>
    </section>

    <section class="display-actions" aria-label="Действия экрана актёра">
      <button id="fullscreen" type="button">На весь экран</button>
      <button id="refreshDisplay" type="button" data-variant="quiet">Обновить</button>
    </section>
  </main>

  <script src="i18n.js"></script>
  <script src="display.js"></script>
</body>
</html>
